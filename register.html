<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Awana 報名 | WCEC</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap" id="app" aria-live="polite"></div>

<script src="config.js"></script>
<script src="demo/gas-shim.js"></script>
<script src="common.js"></script>
<script>
(function () {
  var W = WCEC, t = W.t, esc = W.esc;
  var app = document.getElementById('app');
  var cfg = null, result = null, sending = false, tried = false, topError = '', newAnyway = false;
  var parent, kids, consent, honeypot;
  resetForm();

  function resetForm() {
    parent = { first: '', last: '', phone: '', email: '', emergencyName: '', emergencyPhone: '', pickup: '' };
    kids = [newKid()]; consent = false; honeypot = ''; tried = false; topError = '';
  }
  function newKid() { return { first: '', last: '', grade: '', notes: '' }; }
  function digits(v) { return String(v || '').replace(/\D/g, ''); }
  function clsOf(g) { var m = (cfg.grades || []).filter(function (x) { return x.grade === g; })[0]; return m ? m.cls : ''; }

  // ─── 驗證 ───
  function errors() {
    var e = {};
    if (!parent.first.trim()) e['p.first'] = t('err_required');
    if (!parent.last.trim()) e['p.last'] = t('err_required');
    if (digits(parent.phone).length < 10) e['p.phone'] = t('err_phone');
    if (!/^\S+@\S+\.\S+$/.test(parent.email.trim())) e['p.email'] = t('err_email');
    if (!parent.emergencyName.trim()) e['p.emergencyName'] = t('err_required');
    if (digits(parent.emergencyPhone).length < 10) e['p.emergencyPhone'] = t('err_phone');
    kids.forEach(function (k, i) {
      if (!k.first.trim()) e['k' + i + '.first'] = t('err_required');
      if (!k.last.trim()) e['k' + i + '.last'] = t('err_required');
      if (!k.grade) e['k' + i + '.grade'] = t('err_required');
    });
    if (!consent) e.consent = t('err_consent');
    return e;
  }

  // ─── 畫面 ───
  function field(id, label, value, opts) {
    opts = opts || {};
    var err = tried && errors()[id];
    var input = opts.textarea
      ? '<textarea id="' + id + '" data-bind="' + id + '">' + esc(value) + '</textarea>'
      : '<input id="' + id + '" data-bind="' + id + '" type="' + (opts.type || 'text') + '" value="' + esc(value) + '"' +
        (opts.auto ? ' autocomplete="' + opts.auto + '"' : '') + (opts.type === 'tel' ? ' inputmode="tel"' : '') + '>';
    return '<div class="' + (err ? 'bad' : '') + '">' +
      '<label class="f" for="' + id + '">' + esc(label) + (opts.req ? '<span class="req">' + t('required') + '</span>' : '') + '</label>' +
      input + (opts.hint ? '<p class="hint">' + esc(opts.hint) + '</p>' : '') +
      '<div class="msg">' + esc(err || '') + '</div></div>';
  }

  function header() {
    return '<header class="top"><div><h1>' + t('reg_title') + '</h1><p class="sub">' + t('reg_sub') +
      (cfg && cfg.year ? ' · ' + esc(cfg.year) : '') + '</p></div>' +
      '<button class="btn ghost small langbtn" id="lang" type="button">' + t('lang_btn') + '</button></header>' + W.demoBar();
  }

  function render() {
    if (!cfg) { app.innerHTML = header() + '<p class="center"><span class="spinner"></span></p>'; bindTop(); return; }
    if (result) return renderDone();
    if (!cfg.open) { app.innerHTML = header() + '<div class="card"><p>' + t('closed') + '</p></div>'; bindTop(); return; }

    var gradeOpts = function (sel) {
      return '<option value="">' + t('grade_pick') + '</option>' + cfg.grades.map(function (g) {
        return '<option value="' + esc(g.grade) + '"' + (g.grade === sel ? ' selected' : '') + '>' + esc(W.gradeLabel(g.grade)) + '</option>';
      }).join('');
    };

    var html = header();
    if (W.getToken() && !newAnyway) {
      app.innerHTML = html + '<section class="card"><p>' + t('reg_logged_in') + '</p>' +
        '<a class="btn block" href="' + W.link('parent.html') + '">' + t('go_parent') + '</a><p></p>' +
        '<button class="btn linkbtn block" id="anyway" type="button">' + t('reg_new_anyway') + '</button></section>';
      bindTop();
      document.getElementById('anyway').onclick = function () { newAnyway = true; render(); };
      return;
    }
    if (topError) html += '<div class="banner err" role="alert">' + esc(topError) + '</div>';
    html += '<div class="card row" style="align-items:center"><span>' + t('have_account') + '</span>' +
      '<a class="btn ghost small" style="flex:0 0 auto" href="' + W.link('parent.html') + '">' + t('go_parent') + '</a></div>';

    html += '<form id="f" novalidate><section class="card"><h2>' + t('parent') + '</h2>' +
      '<p class="hint">' + t('name_hint') + '</p><div class="row">' + field('p.first', t('first'), parent.first, { req: 1, auto: 'given-name' }) +
      field('p.last', t('last'), parent.last, { req: 1, auto: 'family-name' }) + '</div>' +
      field('p.phone', t('phone'), parent.phone, { req: 1, type: 'tel', auto: 'tel', hint: t('phone_hint') }) +
      field('p.email', t('email'), parent.email, { req: 1, type: 'email', auto: 'email', hint: t('email_hint') }) +
      '</section><section class="card"><h2>' + t('emergency') + '</h2>' +
      field('p.emergencyName', t('emergency_name'), parent.emergencyName, { req: 1 }) +
      field('p.emergencyPhone', t('emergency_phone'), parent.emergencyPhone, { req: 1, type: 'tel' }) +
      field('p.pickup', t('pickup'), parent.pickup, { textarea: 1, hint: t('pickup_hint') }) +
      '</section><section class="card"><h2>' + t('kids') + '</h2>';

    kids.forEach(function (k, i) {
      var gErr = tried && errors()['k' + i + '.grade'];
      html += '<div class="kid"><div class="kid-head"><h3>' + t('kid_n', { n: i + 1 }) + '</h3>' +
        (kids.length > 1 ? '<button type="button" class="btn ghost small" data-remove="' + i + '">' + t('remove') + '</button>' : '') + '</div>' +
        '<div class="row">' + field('k' + i + '.first', t('first'), k.first, { req: 1 }) +
        field('k' + i + '.last', t('last'), k.last, { req: 1 }) + '</div>' +
        '<div class="' + (gErr ? 'bad' : '') + '"><label class="f" for="k' + i + '.grade">' + t('grade') + '<span class="req">' + t('required') + '</span></label>' +
        '<select id="k' + i + '.grade" data-bind="k' + i + '.grade">' + gradeOpts(k.grade) + '</select>' +
        (k.grade && clsOf(k.grade) ? '<span class="cls-tag">' + t('cls') + '：' + esc(clsOf(k.grade)) + '</span>' : '') +
        '<div class="msg">' + esc(gErr || '') + '</div></div>' +
        field('k' + i + '.notes', t('notes'), k.notes, { textarea: 1, hint: t('notes_hint') }) +
        '</div>';
    });

    var cErr = tried && errors().consent;
    html += (kids.length < 8 ? '<button type="button" class="btn ghost block" id="add">' + t('add_kid') + '</button>' : '') +
      '</section><section class="card ' + (cErr ? 'bad' : '') + '">' +
      '<label class="check"><input type="checkbox" id="consent"' + (consent ? ' checked' : '') + '><span>' + t('consent') + '</span></label>' +
      '<div class="msg">' + esc(cErr || '') + '</div></section>' +
      '<div class="hp" aria-hidden="true"><input tabindex="-1" autocomplete="off" id="website" value="' + esc(honeypot) + '"></div>' +
      '<button class="btn block" type="submit"' + (sending ? ' disabled' : '') + '>' + (sending ? t(sending) : t('submit')) + '</button></form>';

    app.innerHTML = html;
    bindTop();
    app.querySelectorAll('[data-bind]').forEach(function (el) {
      el.addEventListener(el.tagName === 'SELECT' ? 'change' : 'input', function () {
        var key = el.getAttribute('data-bind'), v = el.value;
        if (key[0] === 'p') parent[key.slice(2)] = v;
        else { var m = key.match(/^k(\d+)\.(\w+)$/); kids[+m[1]][m[2]] = v; }
        if (el.tagName === 'SELECT' || tried) render();
      });
    });
    app.querySelectorAll('[data-remove]').forEach(function (b) {
      b.onclick = function () { kids.splice(+b.getAttribute('data-remove'), 1); render(); };
    });
    var add = document.getElementById('add');
    if (add) add.onclick = function () { kids.push(newKid()); render(); var el = document.getElementById('k' + (kids.length - 1) + '.first'); if (el) el.focus(); };
    document.getElementById('consent').onchange = function (e) { consent = e.target.checked; if (tried) render(); };
    document.getElementById('website').oninput = function (e) { honeypot = e.target.value; };
    document.getElementById('f').onsubmit = submit;
  }

  // 輸入中途重畫時把游標放回原處
  var _render = render;
  render = function () {
    var a = document.activeElement, id = a && a.id, pos = a && a.selectionStart;
    _render();
    if (id) { var el = document.getElementById(id); if (el) { el.focus(); try { if (pos != null) el.setSelectionRange(pos, pos); } catch (e) {} } }
  };

  function bindTop() {
    var b = document.getElementById('lang');
    if (b) b.onclick = function () { W.setLang(W.lang() === 'en' ? 'zh' : 'en'); render(); };
  }

  // ─── 送出：先檢查是不是已經登記過 ───
  function submit(ev) {
    ev.preventDefault();
    tried = true; topError = '';
    var e = errors();
    if (Object.keys(e).length) {
      topError = t('err_fix'); render();
      var first = document.getElementById(Object.keys(e)[0]); if (first) { first.focus(); first.scrollIntoView({ block: 'center' }); }
      return;
    }
    sending = 'checking'; render();
    W.call('precheck', { parent: { first: parent.first, last: parent.last, email: parent.email, phone: parent.phone },
                         kids: kids.map(function (k) { return { first: k.first, last: k.last }; }) }).then(function (r) {
      sending = false; render();
      if (!r.ok) { topError = W.errText(r.error); render(); return; }
      if (r.match === 'strong') return askStrong(r);
      if (r.match === 'possible') return askPossible(r);
      sendRegistration({});
    });
  }

  // Email 或電話完全相同：一定是同一個家庭，不讓它再建立新家庭
  function askStrong(r) {
    var c = r.candidates[0];
    W.dialog({
      title: t('dup_strong_title'),
      body: '<p><b>' + t(r.reason === 'email' ? 'dup_strong_email' : 'dup_strong_phone') + '</b></p><p>' + t('dup_strong_body') + '</p>',
      actions: [
        { label: t('dup_send', { email: c.masked }), onClick: function (close) { startLogin(c.ref, close); return true; } },
        { label: t('cancel'), kind: 'ghost' },
      ],
    });
  }

  // 家長或孩子同名：讓家長自己確認是不是他（只顯示遮住的 Email）
  function askPossible(r) {
    var body = '<p>' + t('dup_maybe_body') + '</p>' + r.candidates.map(function (c, i) {
      var why = c.reason.split('+').map(function (x) { return t('dup_reason_' + x); }).join('、');
      return '<div class="cand"><span class="why">' + esc(why) + '</span><dl>' +
        '<dt>' + t('dup_parent') + '</dt><dd>' + esc(c.parent) + '</dd>' +
        '<dt>' + t('dup_email') + '</dt><dd>' + esc(c.masked || '—') + '</dd></dl>' +
        (c.masked ? '<button type="button" class="btn block" data-cand="' + i + '">' + t('dup_its_me') + '</button>' : '') + '</div>';
    }).join('');
    var d = W.dialog({
      title: t('dup_maybe_title'),
      body: body,
      actions: [
        { label: t('dup_not_me'), kind: 'ghost', onClick: function () { sendRegistration({}); } },
        { label: t('dup_old_email'), kind: 'link', onClick: function () { askOldEmail(); } },
        { label: t('cancel'), kind: 'link' },
      ],
    });
    d.el.querySelectorAll('[data-cand]').forEach(function (b) {
      b.onclick = function () { startLogin(r.candidates[+b.getAttribute('data-cand')].ref, d.close); };
    });
  }

  function askOldEmail() {
    W.dialog({
      title: t('dup_old_title'),
      body: '<p>' + t('dup_old_body') + '</p>',
      actions: [
        { label: t('dup_old_go'), onClick: function () { sendRegistration({ oldEmail: true }); } },
        { label: t('cancel'), kind: 'ghost' },
      ],
    });
  }

  // 寄確認信到原本的 Email，然後到家長專區等確認
  function startLogin(ref, close) {
    W.call('loginStart', { ref: ref, device: W.deviceLabel() }).then(function (r) {
      if (close) close();
      if (!r.ok) { topError = W.errText(r.error); render(); window.scrollTo(0, 0); return; }
      location.href = W.link('parent.html', { rid: r.rid, num: r.num, m: r.masked });
    });
  }

  function sendRegistration(extra) {
    sending = 'sending'; render();
    W.call('register', Object.assign({ parent: parent, kids: kids, consent: consent, website: honeypot, device: W.deviceLabel() }, extra))
      .then(function (r) {
        sending = false;
        if (r.ok) { result = r; if (r.token) W.setToken(r.token); window.scrollTo(0, 0); }
        else topError = W.errText(r.error);
        render();
      });
  }

  function renderDone() {
    var r = result, html = header() + '<section class="card big-ok"><div class="icon" aria-hidden="true">✅</div><h2>' + t('ok_title') + '</h2>';
    if (r.kids.length) html += '<ul class="kids-done">' + r.kids.map(function (k) {
      return '<li>' + esc(k.name) + (k.cls ? ' · <b>' + esc(k.cls) + '</b>' : '') + '</li>'; }).join('') + '</ul>';
    else html += '<p>' + t('ok_none') + '</p>';
    if (r.token) {
      html += '<p>' + t('ok_or', { last4: esc(r.last4) }) + '</p>' +
        '<a class="btn block" href="' + W.link('parent.html') + '">' + t('ok_enter') + '</a><p class="hint">' + t('ok_enter_hint') + '</p>';
    } else if (r.dup) {
      html += '<p>' + t('ok_dup') + '</p><button class="btn block" id="dupLogin" type="button">' + t('dup_send', { email: esc(r.masked) }) + '</button>';
    }
    if (r.kids.length && !W.DEMO) html += '<p class="hint">' + t('ok_mail') + '</p>';
    html += '<p></p><button class="btn ghost block" id="again" type="button">' + t('again') + '</button></section>';
    app.innerHTML = html;
    bindTop();
    document.getElementById('again').onclick = function () { result = null; resetForm(); render(); };
    var dl = document.getElementById('dupLogin');
    if (dl) dl.onclick = function () { dl.disabled = true; startLogin(r.ref); };
  }

  render();
  W.call('config').then(function (c) { cfg = c.ok ? c : { open: false, grades: [] }; render(); });
})();
</script>
</body>
</html>
